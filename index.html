<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f2b">
<title>Tech Upskilling Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f2b; --ink:#f3f1ff; --muted:#a9a8cc;
  --violet:#8b7bff; --teal:#3fe0c5; --amber:#ffb86b;
  --glass:rgba(255,255,255,.07); --edge:rgba(255,255,255,.16);
  --head:'Bricolage Grotesque','Trebuchet MS',sans-serif;
  --body:'DM Sans','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:var(--body);color:var(--ink);background:var(--bg);
  min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));
  overflow-x:hidden;
}
/* soft glowing colors behind the glass */
.glow{position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;z-index:0;pointer-events:none}
.g1{width:300px;height:300px;background:var(--violet);top:-80px;left:-90px;animation:drift 18s ease-in-out infinite alternate}
.g2{width:260px;height:260px;background:var(--teal);bottom:-70px;right:-80px;opacity:.4;animation:drift 22s ease-in-out infinite alternate-reverse}
.g3{width:200px;height:200px;background:var(--amber);top:45%;right:-90px;opacity:.22;animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(40px,60px) scale(1.15)}}

.card{
  position:relative;z-index:1;width:100%;max-width:440px;
  background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
  border:1px solid var(--edge);border-radius:28px;
  -webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);
  box-shadow:0 24px 60px rgba(3,4,20,.55),inset 0 1px 0 rgba(255,255,255,.22);
  padding:26px 22px 22px;
}
header h1{font-family:var(--head);font-size:1.55rem;line-height:1.15;letter-spacing:-.01em}
header p{color:var(--muted);font-size:.9rem;margin-top:6px;line-height:1.45}

.progress{display:flex;align-items:center;gap:12px;margin:22px 0 4px}
.bar{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--violet),var(--teal));transition:width .45s cubic-bezier(.3,.8,.3,1)}
.count{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}

.q{min-height:250px;padding-top:18px}
.q.in{animation:slide .35s ease both}
.q.in.back{animation-name:slideBack}
@keyframes slide{from{opacity:0;transform:translateX(24px)}}
@keyframes slideBack{from{opacity:0;transform:translateX(-24px)}}
.q label{display:block;font-family:var(--head);font-size:1.25rem;line-height:1.3;font-weight:600;margin-bottom:14px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{
  font:500 .85rem var(--body);color:var(--ink);cursor:pointer;
  background:var(--glass);border:1px solid var(--edge);border-radius:99px;padding:9px 14px;
  transition:background .2s,border-color .2s,transform .15s;
}
.chip:active{transform:scale(.95)}
.chip.on{background:rgba(139,123,255,.3);border-color:var(--violet)}

textarea{
  width:100%;resize:none;font:400 1rem/1.5 var(--body);color:var(--ink);
  background:rgba(8,9,30,.45);border:1px solid var(--edge);border-radius:16px;
  padding:14px 15px;min-height:96px;transition:border-color .2s,box-shadow .2s;
}
textarea::placeholder{color:rgba(169,168,204,.65)}
textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px rgba(63,224,197,.15)}

.nav{display:flex;gap:10px;margin-top:20px}
button{font-family:var(--body);cursor:pointer}
.btn{
  flex:1;border:0;border-radius:16px;padding:15px;font-size:1rem;font-weight:600;color:#fff;
  background:linear-gradient(135deg,#6f5cff,#9a6bff);
  box-shadow:0 10px 24px rgba(111,92,255,.4),inset 0 1px 0 rgba(255,255,255,.3);
  transition:transform .15s,opacity .2s,box-shadow .2s;
}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
.btn.send{background:linear-gradient(135deg,#27c9ae,#6f5cff)}
.ghost{
  flex:0 0 auto;width:54px;border-radius:16px;font-size:1.3rem;color:var(--ink);
  background:var(--glass);border:1px solid var(--edge);
}
.ghost[hidden]{display:none}
.btn:focus-visible,.chip:focus-visible,.ghost:focus-visible{outline:2px solid var(--teal);outline-offset:3px}

.done{text-align:center;padding:30px 6px 10px;animation:slide .5s ease both}
.tick{
  width:76px;height:76px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--teal),var(--violet));font-size:2.2rem;
  box-shadow:0 0 0 10px rgba(63,224,197,.12),0 12px 30px rgba(63,224,197,.3);
}
.done h2{font-family:var(--head);font-size:1.5rem;margin-bottom:8px}
.done p{color:var(--muted);line-height:1.5;font-size:.95rem}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>

<main class="card" id="card">
  <header>
    <h1>Tech Upskilling Project</h1>
    <p>Your honest answers will shape this platform. It takes 2 minutes.</p>
  </header>

  <div id="flow">
    <div class="progress">
      <div class="bar"><i id="fill"></i></div>
      <span class="count" id="count">1/8</span>
    </div>
    <form id="surveyForm">
      <section class="q" id="q"></section>
      <div class="nav">
        <button type="button" class="ghost" id="back" aria-label="Previous question" hidden>‹</button>
        <button type="button" class="btn" id="next" disabled>Next</button>
      </div>
    </form>
  </div>

  <div class="done" id="done" hidden>
    <div class="tick">✓</div>
    <h2>Thank you!</h2>
    <p>Your answers are in. They will help build a platform that really works for young job seekers.</p>
  </div>
</main>

<script>
// I added the exact ID names that match your Google Sheets headers
const QUESTIONS = [
  {id: "employment_status", t:"What is your current employment status?", ph:"Type your answer…", chips:["Student","Unemployed","Working part-time","Working full-time"]},
  {id: "struggle_reason", t:"What is the biggest reason people struggle to find jobs right now?", ph:"E.g., Companies want 3 years of experience for entry-level jobs…"},
  {id: "valuable_skills", t:"Which skills do you think employers value most?", ph:"Pick or type your own…", chips:["Coding","AI prompting","Sales","Design","Communication"], multi:true},
  {id: "likelihood_to_use", t:"If a platform taught high-income skills to unemployed youth, how likely are you to use it?", ph:"E.g., I would definitely use it if it's affordable…", chips:["Very likely","Maybe","Not likely"]},
  {id: "time_dedication", t:"How much time could you give to learning each week?", ph:"E.g., 2 hours a day…", chips:["Under 3 hours","3–7 hours","7+ hours","Weekends only"]},
  {id: "payment_model", t:"What is the fairest way for this platform to charge?", ph:"E.g., Free with ads, or pay a small fee only after getting a job…", chips:["Free with ads","Small monthly fee","Pay after getting a job"]},
  {id: "device_preference", t:"Do you prefer learning on a mobile phone or a PC/laptop?", ph:"Type your answer…", chips:["Mobile phone","PC / Laptop","Both"]},
  {id: "failure_reason", t:"Be brutally honest: what is one reason a business like this might fail?", ph:"Type your honest thoughts here…"}
];

const answers = QUESTIONS.map(() => "");
let i = 0;

const $ = id => document.getElementById(id);
const q = $("q"), next = $("next"), back = $("back");

// Your specific live Web App URL
const scriptURL = 'https://script.google.com/macros/s/AKfycbzH-HUzSx4tFdXiPVp4OhoM17qscNwwvWbdBkHdXhhGazQWpIvr5KOFyiYMLBhlo7qa/exec';

function render(dir){
  const d = QUESTIONS[i];
  q.className = "q in" + (dir < 0 ? " back" : "");
  q.innerHTML = "";

  const label = document.createElement("label");
  label.htmlFor = "ans"; label.textContent = d.t;
  q.appendChild(label);

  const ta = document.createElement("textarea");
  ta.id = "ans"; ta.placeholder = d.ph; ta.value = answers[i]; ta.rows = 3;
  // Let user press Enter to submit/go next if they aren't typing multi-line
  ta.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if (!next.disabled) next.click();
    }
  });

  if (d.chips){
    const row = document.createElement("div"); row.className = "chips";
    d.chips.forEach(c => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = c;
      b.onclick = () => pick(c, d, ta);
      row.appendChild(b);
    });
    q.appendChild(row);
  }
  q.appendChild(ta);

  ta.addEventListener("input", () => { answers[i] = ta.value; sync(); });
  sync();

  const last = i === QUESTIONS.length - 1;
  next.textContent = last ? "Send my answers" : "Next";
  next.classList.toggle("send", last);
  back.hidden = i === 0;
  $("fill").style.width = ((i + 1) / QUESTIONS.length * 100) + "%";
  $("count").textContent = (i + 1) + "/" + QUESTIONS.length;
  
  // Auto-focus the text area slightly after animation
  setTimeout(() => ta.focus(), 50);
}

function pick(c, d, ta){
  if (d.multi){
    const list = ta.value.split(",").map(s => s.trim()).filter(Boolean);
    const at = list.indexOf(c);
    at > -1 ? list.splice(at, 1) : list.push(c);
    ta.value = list.join(", ");
  } else {
    ta.value = c;
  }
  answers[i] = ta.value;
  sync();
}

function sync(){
  const v = answers[i].trim();
  next.disabled = !v;
  const chips = q.querySelectorAll(".chip");
  const parts = v.split(",").map(s => s.trim());
  chips.forEach(c => c.classList.toggle("on", parts.includes(c.textContent)));
}

next.onclick = () => {
  if (i < QUESTIONS.length - 1){ i++; render(1); }
  else submit();
};
back.onclick = () => { if (i > 0){ i--; render(-1); } };

function submit(){
  // Change button state
  next.disabled = true;
  next.textContent = "Submitting...";

  // Create form data using the exact IDs for Google Sheets
  const formData = new FormData();
  QUESTIONS.forEach((d, n) => {
    formData.append(d.id, answers[n].trim());
  });

  // Send to Google Sheets backend
  fetch(scriptURL, { 
    method: 'POST', 
    body: formData 
  })
  .then(response => {
    $("flow").hidden = true;
    $("done").hidden = false;
  })
  .catch(error => {
    console.error('Error!', error.message);
    alert("Oops! Something went wrong. Please try again.");
    next.disabled = false;
    next.textContent = "Send my answers";
  });
}

render(1);
</script>
</body>
</html>
